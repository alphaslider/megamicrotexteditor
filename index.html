<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
  :root{--c:#0f4;--b:#000;--f:14px 'JetBrains Mono',monospace;--sz:14px}
  *{box-sizing:border-box}body{background:var(--b);color:var(--c);font:var(--f);margin:0;display:flex;flex-direction:column;height:100vh}
  .bar{display:flex;gap:8px;padding:5px;background:#050505;border-bottom:1px solid #1a1a1c;align-items:center;z-index:20}
  .menu{position:relative}.menu-content{display:none;position:absolute;background:#0a0a0a;border:1px solid #1a1a1c;min-width:140px}
  .menu:hover .menu-content{display:block}.item{display:flex;justify-content:space-between;padding:6px;cursor:pointer;font-size:11px;border-bottom:1px solid #111}
  .item:hover{background:var(--c);color:#000}.x{color:#f44;padding:0 5px}.container{display:flex;flex-grow:1;overflow:hidden}
  #nums{width:45px;padding:15px 5px;text-align:right;color:#444;border-right:1px solid #1a1a1c;user-select:none;background:#050505;overflow:hidden;font-size:var(--sz)}
  #editor{flex-grow:1;background:0;color:inherit;font-family:inherit;font-size:var(--sz);padding:15px;border:0;outline:0;resize:none;white-space:pre;overflow:auto}
  .wrap #editor{white-space:pre-wrap;word-break:break-all}
  .btn-grp{display:flex;border:1px solid #041}
  button,label{background:#000;color:var(--c);border:1px solid #041;font-size:11px;padding:3px 8px;display:flex;align-items:center;cursor:pointer}
  .btn-grp button{border:0;border-left:1px solid #041}
  #cur{margin-left:auto;font-size:10px;opacity:.5}.dirty::after{content:' *';color:#f00}
</style></head><body>
<div class="bar">
  <div class="menu"><button onclick="T(880)">FILE</button><div class="menu-content">
    <div class="item" onclick="f_new()">NEW</div><div class="item" onclick="T(880);i.click()">OPEN</div><div class="item" onclick="T(880);save()">SAVE</div>
  </div></div>
  <div class="menu"><button onclick="T(880)">PROJECTS</button><div id="p-list" class="menu-content"></div></div>
  <div class="btn-grp"><button onclick="zm(2)">+</button><button onclick="zm(-2)">-</button></div>
  <label><input type="checkbox" onchange="T(880);document.body.classList.toggle('wrap');ln()"> WRAP</label>
  <span id="cur"></span>
</div>
<div class="container"><div id="nums"></div><textarea id="editor" spellcheck="false" wrap="off"></textarea></div>
<input type="file" id="i" style="display:none" onchange="open_f(event)">
<script>
  let files={"main.js":"// Text Zoom Buttons Added\n"},cur="main.js",dirty=!1,sz=14,
  E=document.getElementById('editor'),L=document.getElementById('p-list'),N=document.getElementById('cur'),G=document.getElementById('nums'),
  A=new(window.AudioContext||window.webkitAudioContext)();
  const T=(fs,d=.08)=>{
    if(A.state==='suspended')A.resume();
    (Array.isArray(fs)?fs:[fs]).forEach((f,i)=>{
      let o=A.createOscillator(),g=A.createGain();o.type='square';o.frequency.value=f;
      g.gain.setValueAtTime(.1,A.currentTime+i*d);g.gain.exponentialRampToValueAtTime(.0001,A.currentTime+i*d+d);
      o.connect(g);g.connect(A.destination);o.start(A.currentTime+i*d);o.stop(A.currentTime+i*d+d+.01)
    })
  },
  ln=()=>{G.innerHTML=E.value.split('\n').map((_,i)=>i+1).join('<br>')},
  upd=()=>{
    N.innerText=cur.toUpperCase();N.classList.toggle('dirty',dirty);ln();
    L.innerHTML=Object.keys(files).map(n=>`<div class="item" onclick="T(880);sw('${n}')">${n}${n===cur&&dirty?'*':''}<span class="x" onclick="event.stopPropagation();cls('${n}')">×</span></div>`).join('')
  },
  sw=n=>{if(n!==cur){files[cur]=E.value;cur=n;E.value=files[n];dirty=!1;upd()}},
  save=()=>{files[cur]=E.value;let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([E.value]));a.download=cur;a.click();dirty=!1;upd()},
  cls=n=>{if(((n===cur)?dirty:!1)&&!confirm("Unsaved?"))return;if(Object.keys(files).length>1){T([659,440]);delete files[n];if(cur===n){cur=Object.keys(files)[0];E.value=files[cur];dirty=!1}upd()}},
  f_new=()=>{let n=prompt("Name:");if(n){T([440,659]);files[n]="";sw(n)}},
  open_f=e=>{let f=e.target.files[0],r=new FileReader();r.onload=v=>{T([440,659]);files[f.name]=v.target.result;sw(f.name)};r.readAsText(f)},
  zm=v=>{sz=Math.max(8,sz+v);document.documentElement.style.setProperty('--sz',sz+'px');T(v>0?1200:600);ln()};
  E.oninput=()=>{dirty=!0;upd()};E.onscroll=()=>{G.scrollTop=E.scrollTop};
  E.onkeydown=e=>{
    if(e.key=='Tab'){e.preventDefault();document.execCommand('insertText',!1,'  ')}
    if((e.ctrlKey||e.metaKey)&&e.key=='s'){e.preventDefault();T(880);save()}
  };
  E.value=files[cur];upd();
</script></body></html>
