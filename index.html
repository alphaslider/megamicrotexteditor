<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
  :root{--c:#0f4;--b:#000;--sz:14px}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:var(--b);color:var(--c);font:var(--sz) 'JetBrains Mono',monospace;margin:0;display:flex;flex-direction:column;height:100vh;overflow:hidden}
  /* The Punchy Green Inversion */
  ::selection{background:var(--c);color:var(--b)}
  ::-moz-selection{background:var(--c);color:var(--b)}
  
  .bar{display:flex;gap:4px;padding:4px;background:#050505;border-bottom:1px solid #1a1a1c;align-items:center;z-index:20;flex-wrap:wrap}
  .menu{position:relative}.menu-content{display:none;position:absolute;background:#0a0a0a;border:1px solid #1a1a1c;min-width:140px}
  .menu:hover .menu-content{display:block}.item{display:flex;justify-content:space-between;padding:12px;cursor:pointer;font-size:12px;border-bottom:1px solid #111}
  .item:hover{background:var(--c);color:#000}.x{color:#f44;padding:0 8px}.container{display:flex;flex-grow:1;overflow:hidden}
  
  #nums{width:40px;padding:15px 5px;text-align:right;color:#333;border-right:1px solid #1a1a1c;user-select:none;font-size:calc(var(--sz) - 2px);overflow:hidden}
  #editor{flex-grow:1;background:0;color:inherit;font:inherit;padding:15px;border:0;outline:0;resize:none;white-space:pre;overflow:auto;caret-color:var(--c)}
  
  .wrap #editor{white-space:pre-wrap;word-break:break-all}
  button,label{background:#000;color:var(--c);border:1px solid #041;font-size:11px;padding:6px 10px;cursor:pointer;display:flex;align-items:center}
  #cur{margin-left:auto;font-size:10px;opacity:.5;padding-right:5px}.dirty::after{content:' *';color:#f00}

  @media(max-width:600px){
    :root{--sz:16px}.bar{gap:2px}button,label{padding:8px;font-size:12px}
    #nums{width:30px}
  }
</style></head><body>
<div class="bar">
  <div class="menu"><button onclick="T(880)">FILE</button><div class="menu-content">
    <div class="item" onclick="f_new()">NEW</div><div class="item" onclick="T(880);document.getElementById('i').click()">OPEN</div><div class="item" onclick="T(880);save()">SAVE</div>
  </div></div>
  <div class="menu"><button onclick="T(880)">PROJ</button><div id="p-list" class="menu-content"></div></div>
  <button onclick="zm(2)">+</button><button onclick="zm(-2)">-</button>
  <label><input type="checkbox" onchange="T(880);document.body.classList.toggle('wrap');ln()"> WRAP</label>
  <span id="cur"></span>
</div>
<div class="container"><div id="nums"></div><textarea id="editor" spellcheck="false" wrap="off"></textarea></div>
<input type="file" id="i" style="display:none" onchange="open_f(event)">
<script>
  let files={"main.js":"// Logic Dexterity\n"},cur="main.js",dirty=!1,sz=14,
  E=document.getElementById('editor'),L=document.getElementById('p-list'),N=document.getElementById('cur'),G=document.getElementById('nums'),
  A=new(window.AudioContext||window.webkitAudioContext)();
  
  const T=(fs,d=.06)=>{
    if(A.state==='suspended')A.resume();
    (Array.isArray(fs)?fs:[fs]).forEach((f,i)=>{
      let o=A.createOscillator(),g=A.createGain();o.type='square';o.frequency.value=f;
      g.gain.setValueAtTime(.05,A.currentTime+i*d);g.gain.exponentialRampToValueAtTime(.0001,A.currentTime+i*d+d);
      o.connect(g);g.connect(A.destination);o.start(A.currentTime+i*d);o.stop(A.currentTime+i*d+d+.01)
    })
  },
  ln=()=>{G.innerHTML=E.value.split('\n').map((_,i)=>i+1).join('<br>')},
  upd=()=>{
    N.innerText=cur.toUpperCase();N.classList.toggle('dirty',dirty);ln();
    L.innerHTML=Object.keys(files).map(n=>`<div class="item" onclick="T(880);sw('${n}')">${n}${n===cur&&dirty?'*':''}<span class="x" onclick="event.stopPropagation();cls('${n}')">×</span></div>`).join('')
  },
  sw=n=>{if(n!==cur){files[cur]=E.value;cur=n;E.value=files[n];dirty=!1;upd()}},
  save=()=>{
    files[cur]=E.value;const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([E.value],{type:'text/plain'}));
    a.download=cur;document.body.appendChild(a);a.click();document.body.removeChild(a);
    dirty=!1;upd();T([880,1200])
  },
  cls=n=>{if(n===cur&&dirty&&!confirm("Discard?"))return;if(Object.keys(files).length>1){T([659,440]);delete files[n];if(cur===n){cur=Object.keys(files)[0];E.value=files[cur];dirty=!1}upd()}},
  f_new=()=>{let n=prompt("Name:");if(n){T([440,880]);files[n]="";sw(n)}},
  open_f=e=>{
    const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=v=>{T([440,880]);files[f.name]=v.target.result;sw(f.name)};r.readAsText(f)
  },
  zm=v=>{sz=Math.max(10,sz+v);document.documentElement.style.setProperty('--sz',sz+'px');T(v>0?1000:500);ln()};

  E.oninput=()=>{dirty=!0;upd()};E.onscroll=()=>{G.scrollTop=E.scrollTop};
  E.onkeydown=e=>{
    if(e.key=='Tab'){e.preventDefault();document.execCommand('insertText',!1,'  ')}
    if((e.ctrlKey||e.metaKey)&&e.key=='s'){e.preventDefault();save()}
  };
  E.value=files[cur];upd();
</script></body></html>
